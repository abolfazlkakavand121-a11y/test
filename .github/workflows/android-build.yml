name: Build & Release CloudFront Scanner APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
            if [ ! -s debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Cache libv2ray.aar
        id: cache-libv2ray
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: libv2ray-v26.11.9-cdfef146

      - name: Download and verify libv2ray.aar
        if: steps.cache-libv2ray.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.11.9/libv2ray.aar
          echo "cdfef146218233a31a8b52c8b1016557730d3b63fc121d4c84cacea50e669155  app/libs/libv2ray.aar" | sha256sum -c -

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit and Robolectric tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare Release Assets & Checksum
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/CloudFrontScanner-v1.0.0-debug.apk
          (cd release-assets && sha256sum CloudFrontScanner-v1.0.0-debug.apk > CloudFrontScanner-v1.0.0-debug.apk.sha256)
          cat release-assets/CloudFrontScanner-v1.0.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFrontScanner-debug-apk
          path: release-assets/CloudFrontScanner-v1.0.0-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="CloudFront Scanner ${TAG}"
          else
            TAG="v1.0.0-build-${{ github.run_number }}"
            TITLE="CloudFront Scanner v1.0.0 (Build #${{ github.run_number }})"
          fi
          SHA256=$(cut -d' ' -f1 release-assets/CloudFrontScanner-v1.0.0-debug.apk.sha256)
          NOTES=$(printf "### CloudFront Scanner Android APK\n\n- **Commit:** %s\n- **File:** \`CloudFrontScanner-v1.0.0-debug.apk\`\n- **SHA-256:** \`%s\`\n- **Signing:** Debug keystore (ready for direct sideload installation)\n" "${{ github.sha }}" "$SHA256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/CloudFrontScanner-v1.0.0-debug.apk \
              release-assets/CloudFrontScanner-v1.0.0-debug.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              release-assets/CloudFrontScanner-v1.0.0-debug.apk \
              release-assets/CloudFrontScanner-v1.0.0-debug.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
